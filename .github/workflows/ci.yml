name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6" "sqlfluff>=3.2,<4"
      - run: ruff check .
      - run: ruff format --check .
      - run: sqlfluff lint sql dbt/models dbt/tests

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q

  postgres-and-dbt:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SENTINEL_DB_HOST: localhost
      SENTINEL_DB_PORT: "5432"
      SENTINEL_DB_NAME: warehouse
      SENTINEL_DB_USER: ci
      SENTINEL_DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,dbt]"
      - name: Use the dbt installed with the project
        run: echo "SENTINEL_DBT_EXECUTABLE=${pythonLocation}/bin/dbt" >> "$GITHUB_ENV"
      - name: dbt parse
        run: |
          "$SENTINEL_DBT_EXECUTABLE" --version
          "$SENTINEL_DBT_EXECUTABLE" parse --project-dir dbt --profiles-dir dbt
      - name: Integration tests
        env:
          SENTINEL_RUN_INTEGRATION: "1"
        run: |
          export PATH="${pythonLocation}/bin:$PATH"
          pytest tests/integration/test_pipeline_postgres.py -v
      - name: Pipeline run for seven days, then re-run one date
        run: |
          python -m dataops_sentinel.orchestration.cli --init-db --generate --start 2026-01-01 --end 2026-01-07
          python -m dataops_sentinel.orchestration.cli --start 2026-01-03 --try-number 2
      - name: Blocked dirty date
        run: |
          if python -m dataops_sentinel.orchestration.cli --generate --start 2026-01-08 --scenario dirty; then
            echo "dirty data was not blocked" >&2
            exit 1
          fi
      - name: Report
        run: |
          python -m dataops_sentinel.reporting.report --start 2026-01-01 --end 2026-01-08 --output reports/ci_report.md
          cat reports/ci_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: reports/ci_report.md

  airflow-dag:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Airflow with official constraints
        run: |
          pip install "apache-airflow==2.10.4" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.4/constraints-3.12.txt"
          pip install -e ".[dev]"
      - name: DAG import and structure
        env:
          SENTINEL_RUN_INTEGRATION: "1"
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          airflow db migrate
          pytest tests/integration/test_dag_definition.py -v
