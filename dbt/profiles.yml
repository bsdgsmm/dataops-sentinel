dataops_sentinel:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('SENTINEL_DB_HOST', 'localhost') }}"
      port: "{{ env_var('SENTINEL_DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('SENTINEL_DB_NAME', 'warehouse') }}"
      user: "{{ env_var('SENTINEL_DB_USER', 'sentinel') }}"
      password: "{{ env_var('SENTINEL_DB_PASSWORD', '') }}"
      schema: public
      threads: 4
      connect_timeout: 10
